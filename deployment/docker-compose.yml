services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    env_file:
      - ../.env.docker
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gui:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gui
    env_file:
      - ../.env.docker
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
